<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Test</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .chat-container {
        height: 60vh;
        overflow-y: auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 20px;
      }

      .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
      }

      .user-message {
        background-color: #e3f2fd;
        margin-left: 20%;
      }

      .assistant-message {
        background-color: #f5f5f5;
        margin-right: 20%;
      }

      .sql-query {
        background-color: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
        margin: 10px 0;
        font-family: monospace;
      }

      .dataframe {
        margin: 10px 0;
        overflow-x: auto;
      }

      .loading-container {
        display: none;
        justify-content: center;
        align-items: center;
        padding: 10px;
        margin: 10px 0;
      }

      .loading-spinner {
        width: 30px;
        height: 30px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .chat-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }

      .modal-dialog {
        max-width: 1200px;
        width: 90%;
      }
    </style>
  </head>

  <body>
    <!-- Chat Button -->
    <button class="btn btn-primary chat-button" id="openChatButton">
      <i class="bi bi-chat-dots"></i> Chat Test
    </button>

    <!-- Chat Modal -->
    <div
      class="modal fade"
      id="chatModal"
      tabindex="-1"
      aria-labelledby="chatModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="chatModalLabel">Chat Test</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="chat-container" id="chatContainer">
              <!-- Messages will be added here -->
            </div>
          </div>
          <div class="modal-footer">
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="userInput"
                placeholder="Chat Test..."
              />
              <button class="btn btn-primary" type="button" id="sendButton">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const chatContainer = document.getElementById("chatContainer");
      const userInput = document.getElementById("userInput");
      const sendButton = document.getElementById("sendButton");
      const openChatButton = document.getElementById("openChatButton");
      const chatModal = new bootstrap.Modal(
        document.getElementById("chatModal")
      );

      // Open modal when chat button is clicked
      openChatButton.addEventListener("click", () => {
        chatModal.show();
      });

      function createLoadingIndicator() {
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "loading-container";
        loadingDiv.id = "loadingIndicator";

        const spinner = document.createElement("div");
        spinner.className = "loading-spinner";

        loadingDiv.appendChild(spinner);
        return loadingDiv;
      }

      function addMessage(message, isUser) {
        // Format message: replace \n with <br>
        let formatted = message
          .replace(/\n/g, "<br>")
          .replace(/\* (.+?)(?=<br>|$)/g, "<li>$1</li>") // * jadi <li>
          .replace(
            /\+ (.+?)(?=<br>|$)/g,
            "<li style='list-style-type:circle;'>$1</li>"
          ); // + jadi sub <li>

        // Wrap <li> items with <ul> if any
        // Nested: sub-list (circle) di dalam <ul>
        formatted = formatted.replace(/(<li>[\s\S]+?<\/li>)/g, "<ul>$1</ul>");
        formatted = formatted.replace(
          /(<li style='list-style-type:circle;'>[\s\S]+?<\/li>)/g,
          "<ul style='margin-left:20px;'>$1</ul>"
        );

        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${
          isUser ? "user-message" : "assistant-message"
        }`;
        messageDiv.innerHTML = formatted;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function displayResponse(response) {
        // Add SQL query if available
        if (response.sql_query) {
          const sqlDiv = document.createElement("div");
          sqlDiv.className = "sql-query";
          sqlDiv.innerHTML = `<strong>SQL Query:</strong><br><pre>${response.sql_query}</pre>`;
          chatContainer.appendChild(sqlDiv);
        }

        // Add answer summary
        if (response.answer_summary) {
          addMessage(response.answer_summary, false);
        }

        // Add dataframe if available
        if (response.dataframe) {
          const dfDiv = document.createElement("div");
          dfDiv.className = "dataframe";
          dfDiv.innerHTML = response.dataframe;
          chatContainer.appendChild(dfDiv);
        }
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Add user message to chat
        addMessage(message, true);
        userInput.value = "";

        // Create and show loading indicator
        const loadingIndicator = createLoadingIndicator();
        chatContainer.appendChild(loadingIndicator);
        loadingIndicator.style.display = "flex";

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          });

          const data = await response.json();
          displayResponse(data);
        } catch (error) {
          console.error("Error:", error);
          addMessage("Error communicating with the server", false);
        } finally {
          // Remove loading indicator
          loadingIndicator.remove();
        }
      }

      sendButton.addEventListener("click", sendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
