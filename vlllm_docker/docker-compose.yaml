version: "3.9"

services:
  vllm:
    image: vllm-server:latest
    container_name: vllm-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./LLM_Models/Meta-Llama-3.1-8B-Instruct-AWQ-INT4:/model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - --model
      - /model
      - --quantization
      - awq
      - --enforce-eager
      - --gpu-memory-utilization
      - "1"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "4"
      - --trust-remote-code
      - --port
      - "8000"